<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice · Smoothie Truck Math</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥤</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🥤 Zuri's Smoothie Truck Math</a>
    <span id="who" class="who"></span>
  </header>

  <main class="wrap" id="layout">
   <div class="col-main">
    <section id="missionBar" class="card mission-bar" hidden aria-label="Mission progress">
      <div class="mb-top">
        <span class="mb-title">🎯 <b id="mbTitle"></b></span>
        <span id="mbCount" class="mb-count"></span>
        <button id="finishBtn" class="btn" type="button">Finish</button>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" id="mbBar"><div id="mbFill"></div></div>
    </section>

    <div class="levelbar">
      <span id="lessonLabel" class="lesson-label"></span>
      <div class="levelbar-right">
        <button id="calcToggle" class="btn calc-toggle" type="button" aria-pressed="false">🧮 Calculator</button>
        <div id="levelSwitch" class="seg" role="group" aria-label="Level"></div>
      </div>
    </div>

    <div id="roles" class="roles" hidden></div>

    <article class="card qcard" id="qcard">
      <div id="qmeta" class="qmeta"></div>
      <p id="qtext" class="qtext"></p>

      <form id="answerForm" class="answer" autocomplete="off">
        <div id="inputs" class="inputs"></div>
        <button id="checkBtn" class="btn primary" type="submit">Check</button>
      </form>

      <div id="feedback" class="feedback" aria-live="polite"></div>

      <div class="actions">
        <button id="stepsBtn" class="btn" type="button">Show me the steps</button>
        <button id="skipBtn" class="btn ghost" type="button">Skip</button>
        <button id="nextBtn" class="btn primary" type="button" hidden>Next question →</button>
      </div>

      <div id="steps" class="steps" hidden></div>
    </article>

    <section class="stats" aria-label="Your progress">
      <div><b id="sAtt">0</b><span>attempted</span></div>
      <div><b id="sCor">0</b><span>correct</span></div>
      <div><b id="sFirst">0</b><span>first try</span></div>
    </section>
   </div>
  </main>

  <section id="endScreen" class="end" hidden role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div class="end-inner">
      <p id="endNames" class="end-names"></p>
      <h1 id="endTitle" class="end-title"></h1>
      <p id="endScore" class="end-score"></p>
      <p id="endBonus" class="end-bonus"></p>
      <div id="endLevels" class="end-levels"></div>
      <p id="endMeta" class="end-meta"></p>
      <p class="end-hint">Show this screen to your teacher.</p>
      <button id="keepGoing" class="btn end-btn" type="button">Keep practising</button>
    </div>
  </section>

  <script src="js/engine.js"></script>
  <script src="units/index.js"></script>
  <script src="js/mission.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
